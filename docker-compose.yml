# Start everything: docker compose up --build   (app on http://localhost:8080)
# Put secrets in backend/.env (copy backend/.env.example); values below override the hosts.
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/newsguard_ai
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:8080
    depends_on: [mongo, redis]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  mongo-data:
